name: Update release PR
description: Update or create release PR with feature list and assignee by team
inputs:
  pr-title:
    description: Title of PR (can't use single quote)
    required: true
  source-branch:
    description: Source branch of PR
    required: true
  destination-branch:
    description: Destination branch of PR
    required: true
  asignee-team:
    description: GitHub team to be assigned
  format:
    description: |
      Format of each PR line in the PR body.
      See https://github.com/seqsense/extract-pr-titles-action for the placeholders.
      Task list items (e.g. "* [ ] #{number}") checked in the current PR body are kept checked
      when the body is updated. Lines are matched by the text after the checkbox.
    default: "* #{number}"
  bot-format:
    description: |
      Format of each PR line authored by bots (e.g. "* #{number}" to exclude them from the task list).
      If not set, format is used.
  bots:
    description: |
      Comma or newline separated authors treated as bots in addition to the ones with "[bot]" suffix.
  github-token:
    description: GitHub token used to open PR
    default: ${{ github.token }}
    required: true
runs:
  using: composite
  steps:
    - name: Validate inputs
      uses: actions/github-script@v9
      env:
        PR_TITLE: ${{ inputs.pr-title }}
        SOURCE_BRANCH: ${{ inputs.source-branch }}
        DESTINATION_BRANCH: ${{ inputs.destination-branch }}
      with:
        script: |
          let error = false
          ;[
            process.env.PR_TITLE,
          ].forEach((val) => {
            if (!/^[^'\\]+$/.test(val)) {
              error = true
              core.error(`must not contain single quote nor backslash: ${val}`)
            }
          })
          ;[
            process.env.SOURCE_BRANCH,
            process.env.DESTINATION_BRANCH,
          ].forEach((val) => {
            if (!/^[a-zA-Z0-9.\-_/]+$/.test(val)) {
              error = true
              core.error(`must be branch name: ${val}`)
            }
          })
          if (error) {
            throw 'validation error'
          }
    - uses: seqsense/extract-pr-titles-action@v0
      id: description
      with:
        from: origin/${{ inputs.destination-branch }}
        to: origin/${{ inputs.source-branch }}
        format: ${{ inputs.format }}
        bot-format: ${{ inputs.bot-format }}
        bots: ${{ inputs.bots }}
        reverse: true
        github-token: ${{ inputs.github-token }}
    - name: List team member
      uses: actions/github-script@v9
      if: inputs.asignee-team
      id: assignees
      with:
        result-encoding: string
        github-token: ${{ inputs.github-token }}
        script: |
          const members = await github.rest.teams.listMembersInOrg({
            org: context.repo.owner,
            team_slug: '${{ inputs.asignee-team }}',
          })
          return members.data.reduce((acc, v) => {
            acc.push(`--assignee ${v.login}`)
            return acc
          }, []).join(' ')
    - name: Output body as file
      uses: actions/github-script@v9
      env:
        BODY: ${{ steps.description.outputs.titles }}
      with:
        script: |
          const fs = require('fs')
          const process = require('process')
          fs.writeFileSync('/tmp/body.txt', process.env.BODY)
    - name: Open PR
      shell: bash
      run: |
        gh pr create \
            --title '${{ inputs.pr-title }}' \
            --body-file /tmp/body.txt \
            --base ${{ inputs.destination-branch }} \
            --head ${{ inputs.source-branch }} \
            ${{ steps.assignees.outputs.result }} \
          || true
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
    - name: Update PR body
      uses: actions/github-script@v9
      env:
        BODY: ${{ steps.description.outputs.titles }}
        SOURCE_BRANCH: ${{ inputs.source-branch }}
        DESTINATION_BRANCH: ${{ inputs.destination-branch }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { data: prs } = await github.rest.pulls.list({
            ...context.repo,
            base: process.env.DESTINATION_BRANCH,
            head: `${context.repo.owner}:${process.env.SOURCE_BRANCH}`,
            state: 'open',
          })
          if (prs.length === 0) {
            core.setFailed('release PR not found')
            return
          }
          const pr = prs[0]

          // Keep task list items checked in the current body
          const reTask = /^(\s*[-*+] )\[([ xX])\] (.*)$/
          const checked = new Set()
          for (const line of (pr.body || '').split(/\r?\n/)) {
            const m = line.match(reTask)
            if (m && m[2] !== ' ') {
              checked.add(m[3])
            }
          }
          const body = process.env.BODY.split('\n')
            .map((line) => {
              const m = line.match(reTask)
              return m && checked.has(m[3]) ? `${m[1]}[x] ${m[3]}` : line
            })
            .join('\n')

          await github.rest.pulls.update({
            ...context.repo,
            pull_number: pr.number,
            body,
          })
